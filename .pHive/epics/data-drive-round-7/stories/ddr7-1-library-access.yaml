id: ddr7-1-library-access
epic: data-drive-round-7
title: Ship IMLS library visits per capita
status: completed
complexity: medium
methodology: classic
depends_on: []

description: |
  Real IMLS Public Libraries Survey data (static bulk CSV,
  imls.gov/sites/default/files/2026-06/pls_fy2024_csv.zip, confirmed
  live during planning research). Radius-based join (10 miles, same
  haversine pattern as tri-facility-density.ts) instead of the file's
  own unreliable city-name field (confirmed live: 114/512 spine cities,
  including Minneapolis MN, have zero matching row by administrative
  city name). Sums real VISITS and POPU_LSA (population of legal service
  area, a real field in the same file) across every library system
  within radius, computes visits per capita.

acceptance_criteria:
  - "Given a real city's lat/lon, when queried, then real library systems within a 10-mile radius are summed by real VISITS and POPU_LSA, not a name-based lookup."
  - "Given a real, well-known city (New York, NY), when checked, then the real NYPL branch libraries figures (12,325,494 visits, 3,662,652 population served, confirmed live during planning) are reflected in the build."
  - "Given the dataset ships, when checked against dvd-1's completeness test, then it passes with zero exceptions."
  - "Given LOWER visits per capita is the concerning direction (public-good-access framing), when scored, then that direction is used, matching parks/transit/walkability's existing convention, not a risk-framing default."

