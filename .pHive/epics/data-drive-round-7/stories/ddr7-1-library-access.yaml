design_decisions:
  - decision: "Radius-based join (10 miles), not the file's own CITY/STABR fields."
    rationale: "Confirmed live: 114/512 spine cities have zero matching row by administrative city name (e.g. Minneapolis, MN) -- the same class of problem that sank this round's earlier drinking-water attempt. Lat/lon is 100% populated in this file, unlike SDWA's WATER_SYSTEM table."
  - decision: "Lower visits per capita = more concerning."
    rationale: "A public-good-access framing, matching parks.ts/transit-access.ts/walkability.ts's existing convention for access-to-a-resource datasets, not a risk-framing default like most other datasets."

risks:
  - severity: low
    description: "Radius-based summing can double-count a shared regional system across nearby cities, or miss a system just outside the radius."
    mitigation: "Disclosed explicitly in the methodology doc as a real, named limitation of the radius approach, same posture as tri-facility-density.ts's own disclosure."

