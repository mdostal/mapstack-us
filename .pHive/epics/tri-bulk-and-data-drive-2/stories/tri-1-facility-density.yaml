id: tri-1-facility-density
epic: tri-bulk-and-data-drive-2
title: Ship EPA TRI facility density via the real bulk Basic Data File endpoint
status: completed
complexity: medium
methodology: classic
depends_on: []

description: |
  dvd-6 (dataset-verification-drive epic) tried to build this from EPA's live
  query API (data.epa.gov/efservice/tri_facility/...) and hit a real wall --
  16+ minutes for one state, truncated response -- because that table is the
  cumulative historical facility registry (59,208 records since 1987), not
  built for bulk querying. Research for this epic found the real fix: EPA
  publishes a separate, purpose-built bulk download, one pre-built CSV per
  reporting year, confirmed live at data.epa.gov/efservice/downloads/tri/
  mv_tri_basic_download/2024_US/csv -- the complete national file in one
  ~60-second request, 3,525 unique current-year facilities after dedup on
  TRIFD, every one with real lat/lon already present (no crosswalk needed).

  Compute each city's facility count within a 10-mile radius (haversine,
  both sides already have real lat/lon in data/cities.json) -- direct
  rescale, higher count = more concerning.

acceptance_criteria:
  - "Given the real 2024 TRI Basic Data File, when fetched, then it is cached under data/raw/ and not re-downloaded on subsequent runs."
  - "Given a city's real lat/lon and the real facility coordinates, when computing density, then the count is a real haversine radius count, not a placeholder."
  - "Given the dataset ships, when checked against every real dataset's four-artifact convention (dvd-1's completeness test), then it passes with zero exceptions."
  - "Given a real, well-known industrial city (Houston, TX) and a real low-industrial city (San Francisco, CA), when compared, then Houston scores meaningfully higher concern than San Francisco."

