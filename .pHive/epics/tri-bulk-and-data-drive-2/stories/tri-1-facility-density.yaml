design_decisions:
  - decision: "10-mile radius count, not nearest-distance."
    rationale: "Cumulative proximity to multiple facilities is a more defensible real-exposure signal than distance to the single nearest one -- matches air-quality.ts's own radius-based precedent (DISTANCE_MILES=50) rather than heat.ts's nearest-station pattern."

risks:
  - severity: low
    description: "EPA could restructure the bulk download URL/schema in the future."
    mitigation: "Same posture as every other Census/BLS/EPA-sourced script this project has -- fail loud with a clear error rather than silently substituting stale data."

