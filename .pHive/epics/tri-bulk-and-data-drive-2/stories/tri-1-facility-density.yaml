  - id: research
    description: Confirm the bulk download URL and CSV schema still match this story's live-verified findings (EPA endpoints can change).
    agent: researcher
  - id: implement
    description: Write scripts/gen_tri_facility_density_data.py, src/lib/datasets/tri-facility-density.ts, data/tri-facility-density-methodology.md, following the established wrapper pattern (see cost-of-living.ts/business-density.ts as the most recent examples).
    agent: developer
    depends_on: [research]
  - id: test
    description: "tests/tri-facility-density-dataset.test.ts, a new tests/e2e/mapstack.spec.ts block, then pnpm verify end to end."
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review for honest coverage reporting and real methodology disclosure, same bar as every prior dataset.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit, push, and deploy (vercel --prod).
    agent: developer
    depends_on: [review]

