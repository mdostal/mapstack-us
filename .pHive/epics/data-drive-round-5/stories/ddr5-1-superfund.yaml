id: ddr5-1-superfund
epic: data-drive-round-5
title: Ship EPA Superfund/NPL site density
status: completed
complexity: medium
methodology: classic
depends_on: []

description: |
  Real EPA Superfund/NPL site data via the newer Envirofacts dmapservice
  API (data.epa.gov/dmapservice/sems.envirofacts_site/...), confirmed
  live during planning research. Counts real npl_status_code=F (Final
  NPL, the currently-active Superfund site status) sites per county via
  each record's real fips_code field, joined to the spine via the
  existing city-county-fips.json crosswalk -- no new geocoding.

acceptance_criteria:
  - "Given a real state abbreviation, when queried, then the real per-state site list is fetched and cached, not a fabricated count."
  - "Given a county's real Final-NPL site count, when scored, then higher count is more concerning, direct rescale."
  - "Given the dataset ships, when checked against dvd-1's completeness test, then it passes with zero exceptions."

steps:
  - id: research
    description: Confirm the live dmapservice endpoint and npl_status_code values still match this story's live-verified findings.
    agent: researcher
  - id: implement
    description: Write scripts/gen_superfund_data.py, src/lib/datasets/superfund.ts, data/superfund-methodology.md, following the established wrapper pattern.
    agent: developer
    depends_on: [research]
  - id: test
    description: "tests/superfund-dataset.test.ts, a new tests/e2e/mapstack.spec.ts block, then pnpm verify end to end."
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review for honest coverage reporting and real methodology disclosure.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit, push, and deploy (vercel --prod).
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Code/mapstack-us
  key_files:
    - path: data/raw/city-county-fips.json
      purpose: Existing county crosswalk this story reuses unchanged.

files_to_modify: []
code_examples:
  - title: Real confirmed working request (live-checked during planning)
    file: N/A
    snippet: |
      https://data.epa.gov/dmapservice/sems.envirofacts_site/fk_ref_state_code/equals/NJ
      # Real response: 2,216 NJ sites, each with fips_code + npl_status_code.
      # npl_status_code=F (Final NPL) = 115 of NJ's 2,216 total assessed sites.

design_decisions:
  - decision: "Count npl_status_code=F sites only, not all assessed sites."
    rationale: "The vast majority of sites in this table (npl_status_code=N, 'Not on the NPL') were merely assessed and found not to warrant listing -- counting them would conflate 'EPA looked into it' with 'this is an active contamination site,' which Final NPL status is the real, defensible signal for."

risks:
  - severity: low
    description: "Some records have a null fips_code -- a real, partial gap in the source data."
    mitigation: "Skip records with no real fips_code; disclosed in the methodology doc, not silently guessed."

references:
  - path: .pHive/epics/data-drive-round-5/docs/research-brief.md
    relevant_excerpt: |
      Confirmed live: .../sems.envirofacts_site/fk_ref_state_code/equals/NJ
      returns 2,216 real NJ site records... each with a real county
      fips_code.
