id: ddr12-1-winter-cold-burden
epic: data-drive-round-12
title: Ship the 41st real dataset -- NOAA Climate Normals winter cold burden (freezing-days count)
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Add a 41st real dataset to mapstack-us: average annual days with minimum
  temperature at or below freezing (32F), via NOAA NCEI's real 1991-2020 Climate
  Normals. Source: ncei.noaa.gov/access/services/search/v1/data (station
  discovery via bbox search) + ncei.noaa.gov/data/normals-annualseasonal/
  1991-2020/access/{station}.csv (per-station values). Real, live, keyless.
  Two requests per city, no crosswalk file. Metric: ANN-TMIN-AVGNDS-LSTH032,
  direct-rescale (heat.ts's HEAT_DAYS_CAP convention), higher = more concerning.
  Genuinely new hazard angle -- the winter-cold complement to heat.ts's
  extreme-heat concern.

acceptance_criteria:
  - "Given a city with a real nearby normals station, getValue returns a 0-100 value and a detail string naming the real freezing-days count and 'NOAA'"
  - "Given New York NY, the shipped detail reproduces the real freezing-days count from the nearest real NOAA normals station"
  - "Given an unknown city id or layer id, getValue returns null"
  - "High real coverage across the spine (a real nearest-station search may not reach literal 512/512 -- disclose the real coverage number honestly in the methodology doc and coverage-honesty.test.ts, do not fabricate a gap-filling value)"
  - "dataset-completeness.test.ts and coverage-honesty.test.ts pass with zero manual additions beyond the standard file set"

