design_decisions:
  - decision: Direct-rescale with a real, build-checked cap (heat.ts's convention), not percentile-rank
    rationale: A real days-per-year quantity (0-365 natural range), the exact same shape as heat.ts's HEAT_DAYS_CAP -- reusing a proven convention rather than inventing a new one for a structurally identical metric.
  - decision: Two-request-per-city (bbox search + per-station CSV fetch), no bulk download
    rationale: NOAA's search API returns real nearest-station lat/lon directly; a bulk download of all US normals stations would be unnecessary overhead when a targeted per-city lookup works and was rate-limit-tested clean at 60 cities / 8x concurrency.

risks:
  - severity: low
    description: NOAA NCEI service could rate-limit at full 512-city (1024-request) scale despite a clean 60-city test
    mitigation: Modest concurrency + retry-with-backoff, same defensive pattern as gen_historic_site_density_data.py and gen_environmental_violations_data.py; watch for real rate-limit error messages specifically (round 11's lesson) rather than assuming blind retries will succeed

