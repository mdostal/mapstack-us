id: pu-1-comparison-table
epic: power-user-tab
title: Power-user comparison table — new route, checkbox layer picker, per-city table
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Add a new route at /mapstack/advanced (src/app/advanced/page.tsx) that lets a
  user pick 2+ (dataset, layer) pairs via checkboxes and see a comparison table:
  one column per selection, each column header carrying that dataset's
  methodology note (not a footnote), one row per city. This is the first
  vertical slice of the power-user-tab epic — no sort, no shared city/year
  state with the simple view, no saved views yet (those are pu-2, pu-3, pu-4).

  Deliberately does NOT compute any cross-dataset combined/weighted score —
  see .pHive/epics/power-user-tab/docs/design-discussion.md §3 for why (the
  underlying scores aren't on a common statistical basis; combining them,
  even with a visible formula, was removed from scope after an adversarial
  grill pass flagged it as a black-box-heuristic risk).

  This story introduces new user-facing vocabulary ("comparison table") that
  is a distinct concept from the existing "multi-layer stacking" (simultaneous
  map rendering) already documented in .pHive/CONTEXT.md — see cross_cutting
  below for the required glossary follow-up.

acceptance_criteria:
  - "Given the user navigates to /mapstack/advanced, when the page loads, then a checkbox list of all (dataset, layer) pairs from the registry is shown."
  - "Given the user checks 2+ (dataset, layer) pairs, when the selection changes, then a comparison table renders with one column per selection."
  - "Given a comparison table column for a given dataset, when rendered, then its header includes that dataset's methodology note (not hidden in a footnote)."
  - "Given a city has no data for a selected (dataset, layer, year), when getValue returns null, then the table cell shows an explicit 'no data' state, never a fabricated value."
  - "Given fewer than 2 layers are selected, when the page renders, then the table area shows a clear empty/prompt state instead of an empty table."

steps:
  - id: research
    description: Explore src/lib/datasets/registry.ts, active-layers.ts, CityDetailPanel.tsx's city-lookup pattern, and allergy-locator's ProfileCompare.tsx checkbox-list interaction shape.
    agent: researcher
  - id: ui-design
    description: Delegate to /design for wireframes (atomic external call; see skills/design/SKILL.md). Already run during planning — see wireframes section below.
    agent: ui-designer
    delegates_to: design
    depends_on: [research]
  - id: implement
    description: Implement the /mapstack/advanced route, PowerUserPanel, LayerPicker, and ComparisonTable components per the design discussion §3 points 1-2 and the approved wireframe brief.
    agent: developer
    depends_on: [ui-design]
    inputs:
      - source: step_output
        step: ui-design
        key: wireframe_brief
  - id: test
    description: "Write Playwright e2e coverage (navigate, select 2 layers, assert table columns + methodology text + null-data state) per design-discussion §7. Verify with: pnpm test:e2e"
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review implementation and tests for correctness and convention compliance (no cross-dataset score computed anywhere in this story's code).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

