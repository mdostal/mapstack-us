code_examples:
  - title: ActiveLayer shape and helpers to reuse for selection state
    file: src/lib/active-layers.ts
    snippet: |
      export interface ActiveLayer {
        datasetId: string;
        layerId: string;
      }
      export function resolveActiveLayer(active: ActiveLayer): ResolvedActiveLayer | null {
        const dataset = getDataset(active.datasetId);
        if (!dataset) return null;
        const layer = dataset.layers.find((l) => l.id === active.layerId);
        if (!layer) return null;
        return { ...active, dataset, layer };
      }

design_decisions:
  - decision: "No cross-dataset combined score in this story (or this epic's v1)."
    rationale: "Grill-record finding U1 — the underlying scores (percentile-rank vs. climate-modeled) aren't on a common statistical basis; combining them, even transparently, risks the project's own no-black-box-heuristics and gradients-not-buckets principles. See design-discussion.md §3.3."
  - decision: "Real route (/mapstack/advanced), not a client-side tab toggle."
    rationale: "Grill-record finding H1 — next.config.ts's basePath applies to any route automatically, so a route costs nothing extra and gets bookmarkability/back-forward for free."

cross_cutting:
  - concern: documentation
    action: "This story introduces the 'comparison table' concept, distinct from CONTEXT.md's existing 'multi-layer stacking' entry. Add a new CONTEXT.md Terminology entry for 'comparison table' during the integrate step, cross-referencing the existing 'multi-layer stacking' entry so the distinction is documented, not just implied."

risks:
  - severity: medium
    description: "A comparison table naturally invites an eyeballed cross-dataset comparison even without a computed score, since values sit side by side."
    mitigation: "Column-header methodology notes are mandatory (acceptance criteria #3), not optional polish — this is the primary mitigation and is not deferrable to a later story."
  - severity: low
    description: "Cities with no data for a selected (dataset, layer, year) could render as blank/confusing rather than explicit."
    mitigation: "Acceptance criteria #4 requires an explicit 'no data' state, never a blank cell or fabricated 0."

references:
