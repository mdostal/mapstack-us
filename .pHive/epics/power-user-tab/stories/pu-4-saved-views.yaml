    depends_on: [research]
  - id: implement
    description: Implement src/lib/saved-views.ts and src/lib/url-state.ts (adapted for mapstack's shape) and wire saved-views UI into PowerUserPanel per vertical-plan.md Slice 4 and the approved wireframe brief.
    agent: developer
    depends_on: [ui-design]
