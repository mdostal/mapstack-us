id: pu-4-saved-views
epic: power-user-tab
title: Saved views — persist selections + sort choice, restore via localStorage and URL
status: completed
complexity: medium
methodology: classic
depends_on: [pu-2-sort, pu-3-shared-view-state]

description: |
  Epic-complete slice: let the user save the current power-user selection set
  (active layers + sort choice) as a named view, list saved views, restore one
  (updating panel state + URL), and delete/rename. Adapted from allergy-locator's
  proven src/lib/profiles.ts (SSR-safe, fail-open-on-corrupt-JSON localStorage
  CRUD) and its companion url-state.ts — not shared code, a template to port
  and adapt to mapstack's shape ({id, name, selections: ActiveLayer[], sortBy,
  savedAt} instead of {id, name, sensitivities, savedAt}).

  This is the last vertical slice (vertical-plan.md Slice 4) — depends on both
  pu-2 (sort choice is part of the saved shape) and pu-3 (URL-restore builds on
  the shared param helper's conventions).

acceptance_criteria:
  - "Given a user has selected layers and a sort column, when they save a named view, then it appears in a saved-views list."
  - "Given a saved view exists, when the user clicks 'restore', then the panel's selections, sort choice, and URL all update to match the saved view."
  - "Given a full page reload after saving a view, when the saved-views list renders, then the previously saved view is still present (localStorage persisted)."
  - "Given corrupted/foreign JSON exists at the storage key, when getSavedViews() is called, then it returns an empty array rather than throwing — matching allergy-locator's profiles.ts fail-open behavior exactly."
  - "Given a saved view, when the user renames or deletes it, then the list updates accordingly and the change survives a reload."

