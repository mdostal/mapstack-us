code_examples:
  - title: Fail-open-on-corrupt-JSON localStorage read pattern to port exactly
    file: /Users/mdostal/Code/allergy-locator/src/lib/profiles.ts
    snippet: |
      export function getSavedProfiles(): SavedProfile[] {
        if (typeof window === "undefined") return [];
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        try {
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return []; // corrupted/foreign data -- fail open to an empty list, never throw
        }
      }

design_decisions:
  - decision: "Distinct localStorage key namespace from allergy-locator (e.g. mapstack:saved-views, not allergy-locator:saved-profiles)."
    rationale: "These are separate apps/origins in the browser already (different domains), so key collision isn't a real technical risk, but a distinct, self-describing key name keeps the pattern's origin clear for future maintainers."
  - decision: "Saved shape stores selections + sortBy, not any computed/derived values."
    rationale: "Consistent with the epic-wide decision to never persist or compute a cross-dataset combined score (design-discussion §3.3) — a saved view is a set of user choices, not a result."

risks:
  - severity: medium
    description: "A rushed port could silently drop the fail-open-on-corrupt-JSON behavior (e.g. let JSON.parse throw uncaught), regressing relative to the working reference implementation."
    mitigation: "Acceptance criteria #4 requires a dedicated test for this exact behavior; review step explicitly names it as the story's highest risk to check."

