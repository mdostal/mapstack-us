code_examples:
  - title: Direct-rescale-with-observed-cap convention (inverted), precedent from severe-weather.ts
    file: src/lib/datasets/severe-weather.ts
    snippet: |
      const COUNT_CAP = 70; // real p90, checked before shipping
      const concern = Math.min(100, (count / COUNT_CAP) * 100);
      // historic-site-density INVERTS this: concern = 100 * (1 - Math.min(count, CAP) / CAP)

design_decisions:
  - decision: Raw count, direct-rescale-with-observed-cap (COUNT_CAP=290), not percentile-rank or per-capita
    rationale: A real 60-city sample check showed raw count does not correlate with city population -- younger Sun Belt cities score near-zero regardless of population, metro-adjacent suburbs score high independent of their own population. The 10-mile radius is already the normalizing unit; per-capita would not fix anything real distribution showed.
  - decision: Server-side ArcGIS spatial radius query instead of bulk-download + client-side haversine
    rationale: The service supports geometry+distance queries natively with returnCountOnly, verified live to return exact per-city counts in under 2s each at 8x concurrency. Simpler and faster than the tri-facility-density/library-access precedent of downloading a national file and joining locally -- no reason to add that complexity when the server does it directly.

risks:
  - severity: low
    description: NPS ArcGIS service could rate-limit or throttle 512 requests
    mitigation: Modest concurrency (8x, matching the research-phase test that completed cleanly) + retry-with-backoff on transient failures, same pattern as gen_superfund_data.py

