id: ddr10-1-historic-site-density
epic: data-drive-round-10
title: Ship the 39th real dataset -- NRHP historic-site density (radius join, server-side spatial query)
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Add a 39th real dataset to mapstack-us: density of NPS National Register of
  Historic Places (NRHP)-listed sites within 10 miles of each city. Source:
  mapservices.nps.gov/arcgis/rest/services/cultural_resources/nrhp_locations/MapServer/0
  (real, live, keyless). Uses a server-side ArcGIS spatial radius query
  (geometryType=esriGeometryPoint&distance=10&units=esriSRUnit_StatuteMile&
  spatialRel=esriSpatialRelIntersects&returnCountOnly=true) centered on each
  city's own lat/lon from data/cities.json -- no bulk download, no local haversine,
  a first for this session's radius-join pattern. Raw count, direct-rescale with
  COUNT_CAP=290 (real p90 from a 60-city sample check), inverted so 0 nearby sites
  = concern 100 and >=290 nearby sites = concern 0. Follows the "access" framing
  convention (parks.ts/library-access.ts/transit-access.ts).

acceptance_criteria:
  - "Given a city with real NRHP sites within 10mi, getValue returns a 0-100 value and a detail string naming the real count and 'National Register of Historic Places'"
  - "Given New York NY, the shipped detail reproduces the real live-queried count (~800-815) within the 10mi radius"
  - "Given an unknown city id or layer id, getValue returns null"
  - "512/512 real coverage (every city has lat/lon; a 0-count response is a valid real value, not a missing-data null)"
  - "dataset-completeness.test.ts and coverage-honesty.test.ts pass with zero manual additions beyond the standard file set (methodology doc, unit test, e2e block, README bullet)"

