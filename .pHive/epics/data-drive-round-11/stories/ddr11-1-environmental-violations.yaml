design_decisions:
  - decision: Raw SVRows count, direct-rescale-with-observed-cap (COUNT_CAP=41), higher = more concerning, NOT inverted
    rationale: A real 60-city sample check showed p50=7, p75=15, p90=41 -- a clean, well-spread distribution matching the same shape as TRI/Superfund/severe-weather. Unlike round 10's historic-site-density (an access-style "fewer is worse" framing), more nearby active regulatory violations is straightforwardly more concerning -- the same direction convention as the other EPA compliance/hazard datasets.
  - decision: Ship despite no formal API docs (Swagger page timed out)
    rationale: 63+ live requests during research all succeeded with coherent, well-formed responses; SVRows/CVRows are established public EPA ECHO terminology used throughout echo.epa.gov's own public compliance reports (not internal/undocumented field codes). Disclosed as a real limitation in the methodology doc rather than blocking on a docs page that failed to render twice under system load.

risks:
  - severity: low
    description: EPA ECHO service could rate-limit or throttle 512 requests
    mitigation: Modest concurrency + retry-with-backoff, same pattern as gen_historic_site_density_data.py and gen_superfund_data.py

