id: ddr11-1-environmental-violations
epic: data-drive-round-11
title: Ship the 40th real dataset -- EPA ECHO significant-violation density (server-side radius query)
status: completed
complexity: medium
methodology: classic
depends_on: []

description: |
  Add a 40th real dataset to mapstack-us: density of facilities in EPA-tracked
  "Significant Violation" status (active CAA/CWA/RCRA regulatory noncompliance)
  within 10 miles of each city. Source: echodata.epa.gov/echo/echo_rest_services.
  get_facilities (real, live, keyless EPA ECHO REST API, distinct from the
  Envirofacts APIs already used for TRI/Superfund). Server-side spatial radius
  query (p_lat/p_long/p_radius=10), the second dataset this session to need zero
  bulk download / zero local haversine (after round 10's NRHP). Raw SVRows count,
  direct-rescale with COUNT_CAP=41 (real p90 from a 60-city sample check), higher
  = more concerning (TRI/Superfund convention, not inverted).

acceptance_criteria:
  - "Given a city with real significant violations within 10mi, getValue returns a 0-100 value and a detail string naming the real count and 'EPA ECHO'"
  - "Given New York NY, the shipped detail reproduces the real live-queried SVRows count (69) within the 10mi radius"
  - "Given an unknown city id or layer id, getValue returns null"
  - "512/512 real coverage (a 0-count response is a valid real value, not a missing-data null)"
  - "dataset-completeness.test.ts and coverage-honesty.test.ts pass with zero manual additions beyond the standard file set"

