name: data-drive-round-4
title: Fourth data-drive research round -- ship FBI hate crime statistics
description: >
  A fourth fresh dataset-candidate research round. The originally-planned
  build (SDWA drinking water violations) turned out structurally
  infeasible on real live testing against NYC -- abandoned, documented in
  research-brief.md. Pivoted to FBI hate crime statistics, resolving a
  lead deferred across three prior research rounds: the real endpoint
  (/hate-crime/agency/{ori}/{bias}) was found by rendering FBI CDE's
  JS-based docs page via Playwright, unreadable via plain curl. Reuses
  crime.ts's existing 509-city ORI crosswalk and cached population data
  entirely -- zero new geocoding.
