id: ddr4-1-hate-crime
epic: data-drive-round-4
title: Ship FBI hate crime statistics (pivoted from infeasible SDWA drinking water)
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  PIVOTED mid-story: the originally-planned SDWA drinking water violations
  build turned out structurally infeasible on real live testing against
  NYC (see research-brief.md's "UPDATE" section) -- WATER_SYSTEM's
  city_name field is an administrative mailing address, not a service
  area, and no other reliable geographic join field exists in that data
  model. Abandoned, not shipped.

  Pivoted to FBI hate crime statistics instead, resolving a lead deferred
  across three prior research rounds. Found the real endpoint (GET
  /hate-crime/agency/{ori}/{bias}, bias=all) by rendering FBI CDE's
  JS-based docs page via Playwright -- unreadable via plain curl, which is
  why prior rounds' offense-code guessing against the wrong endpoint shape
  failed. Reuses data/raw/crime-agency-matches.json (509 real city->ORI
  mappings already built for crime.ts) and that build's cached per-agency
  population data -- zero new crosswalk work.

acceptance_criteria:
  - "Given a real city with a known ORI, when queried against the real hate-crime endpoint, then the real sum of incident_section.bias values is used as the total incident count, not a fabricated number."
  - "Given that count, when normalized, then it uses the same real cached population data crime.ts already fetched for that agency/year -- no new population fetch."
  - "Given the dataset ships, when checked against dvd-1's completeness test, then it passes with zero exceptions."
  - "Given NYC's real 2023 total (624 incidents, confirmed live during planning), when the dataset is built, then it reproduces that same real number, not an approximation."

steps:
  - id: research
    description: Confirm the live hate-crime endpoint and bias=all enum value still match this story's live-verified findings.
    agent: researcher
  - id: implement
    description: Write scripts/gen_hate_crime_data.py, src/lib/datasets/hate-crime.ts, data/hate-crime-methodology.md, following the established wrapper pattern.
    agent: developer
    depends_on: [research]
  - id: test
    description: "tests/hate-crime-dataset.test.ts, a new tests/e2e/mapstack.spec.ts block, then pnpm verify end to end."
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review for honest coverage reporting and real methodology disclosure (voluntary reporting, real sparsity).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit, push, and deploy (vercel --prod).
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Code/mapstack-us
  key_files:
    - path: data/raw/crime-agency-matches.json
      purpose: Existing 509-city real ORI crosswalk this story reuses unchanged.
    - path: scripts/gen_crime_data.py
      purpose: Sibling script -- same ORI crosswalk, same cached population data, established fetch/cache conventions to follow.

files_to_modify: []
code_examples:
  - title: Real confirmed working request (live-checked during planning, after finding the real docs)
    file: N/A
    snippet: |
      https://api.usa.gov/crime/fbi/cde/hate-crime/agency/NY0303000/all?from=01-2023&to=12-2023&api_key={key}
      # Real response: incident_section.bias is a dict of bias-category -> count;
      # sum(incident_section.bias.values()) = 624 for NYC 2023, confirmed live.

design_decisions:
  - decision: "Reuse crime.ts's cached population data (data/raw/crime-offense-cache/{ori}_violent-crime_{year}.json's populations.population[agency_name]) rather than fetching population separately."
    rationale: "The hate-crime endpoint's own response has no population field; re-fetching would duplicate a real, already-cached value."

risks:
  - severity: low
    description: "Hate crime reporting is voluntary and real counts are often very small or zero -- a real sparsity, not a data quality issue."
    mitigation: "Disclosed explicitly in the methodology doc, same posture as crime.ts's own non-participating-agency disclosure."

references:
  - path: .pHive/epics/data-drive-round-4/docs/research-brief.md
    relevant_excerpt: |
      Found by rendering the FBI CDE's own JS-based API docs page via
      Playwright... Confirmed live against NYC's real ORI: 624 real hate
      crime incidents in 2023.
