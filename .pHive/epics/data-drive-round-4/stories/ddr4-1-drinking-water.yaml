    file: N/A
    snippet: |
      https://data.epa.gov/efservice/WATER_SYSTEM/city_name/HOUSTON/state_code/TX/pws_type_code/CWS/pws_activity_code/A/JSON
      # Top result by population_served_count: CITY OF HOUSTON, 2,970,543 -- the real municipal utility.
      https://data.epa.gov/efservice/VIOLATION/pwsid/{pwsid}/JSON
      # Real fields: is_health_based_ind (Y/N), compl_per_begin_date

design_decisions:
  - decision: "5-year recency window for counting violations, not all-time."
    rationale: "Matches crime.ts's own established convention for time-bounded government data -- a decades-old resolved violation shouldn't score the same as an ongoing recent one."

risks:
  - severity: medium
    description: "Name-based city matching (not FIPS) has a real, non-zero error rate for ambiguous city names or non-obviously-named utilities."
    mitigation: "Disclosed explicitly in the methodology doc, validated live against a real example (Houston) rather than assumed to work."

