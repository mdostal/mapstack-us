id: ddr6-1-earthquake
epic: data-drive-round-6
title: Ship USGS seismic design values (earthquake risk)
status: pending
complexity: low
methodology: classic
depends_on: []

description: |
  Real USGS seismic design parameters (earthquake.usgs.gov/ws/designmaps/
  asce7-22.json, ASCE 7-22 building code standard), confirmed live during
  planning research. Uses each city's own real lat/lon directly -- no
  crosswalk needed. Uses sds (Design Spectral Response Acceleration,
  short period), direct rescale, higher = more concerning. siteClass=D
  (stiff soil) as the standard ASCE 7 default absent site-specific data.

acceptance_criteria:
  - "Given a real city lat/lon, when queried, then the real sds value from the live USGS API is used, not a fabricated or interpolated number."
  - "Given a real high-seismic-risk city (Los Angeles or San Francisco, CA) and a real low-risk city (New York, NY), when compared, then the high-risk city scores meaningfully higher concern -- confirmed live during planning (LA sds=1.51 sdc=D vs NYC sds=0.2 sdc=B)."
  - "Given the dataset ships, when checked against dvd-1's completeness test, then it passes with zero exceptions."

steps:
  - id: research
    description: Confirm the live USGS designmaps endpoint and response schema still match this story's live-verified findings.
    agent: researcher
  - id: implement
    description: Write scripts/gen_earthquake_data.py, src/lib/datasets/earthquake.ts, data/earthquake-methodology.md, following the established wrapper pattern.
    agent: developer
    depends_on: [research]
  - id: test
    description: "tests/earthquake-dataset.test.ts, a new tests/e2e/mapstack.spec.ts block, then pnpm verify end to end."
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review for honest coverage reporting and real methodology disclosure (siteClass default).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit, push, and deploy (vercel --prod).
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Code/mapstack-us
  key_files:
    - path: data/cities.json
      purpose: Already has real lat/lon per city -- no crosswalk needed for this dataset.

files_to_modify: []
code_examples:
  - title: Real confirmed working request (live-checked during planning)
    file: N/A
    snippet: |
      https://earthquake.usgs.gov/ws/designmaps/asce7-22.json?latitude=34.05&longitude=-118.24&riskCategory=I&siteClass=D&title=LA
      # Real response: response.data.sds = 1.51, response.data.sdc = "D"

design_decisions:
  - decision: "sds (short-period design acceleration), not sd1 (1-second period) or pga."
    rationale: "sds is the real, standard headline value ASCE 7 building codes use for the Seismic Design Category classification most engineers and the public recognize."

risks:
  - severity: low
    description: "siteClass=D is a real, standard default, not every city's actual local soil type."
    mitigation: "Disclosed explicitly in the methodology doc as a named simplification."

references:
  - path: .pHive/epics/data-drive-round-6/docs/research-brief.md
    relevant_excerpt: |
      Confirmed live differentiation: Los Angeles sds=1.51, sdc=D; San
      Francisco sds=1.17, sdc=D; New York City sds=0.2, sdc=B -- matches
      real-world seismic knowledge.
