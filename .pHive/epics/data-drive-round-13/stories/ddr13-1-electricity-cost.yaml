id: ddr13-1-electricity-cost
epic: data-drive-round-13
title: Ship the 42nd real dataset -- EIA residential electricity price (state-level)
status: pending
complexity: low
methodology: classic
depends_on: []

description: |
  Add a 42nd real dataset: state-level EIA residential electricity retail
  price (cents/kWh), unlocked by a real EIA_API_KEY obtained this session.
  Direct state-abbreviation join against data/cities.json's existing state
  field, same shape as income-tax.ts/sales-tax.ts. Direct rescale, cap at 41
  (real observed max 40.59, Hawaii), higher = more concerning.

acceptance_criteria:
  - "Given a covered state's city, getValue returns a 0-100 value and a detail string naming the real price and 'EIA'"
  - "Given New York NY, the shipped detail reproduces the real live-queried NY residential price"
  - "Given an unknown city id or layer id, getValue returns null"
  - "Real coverage across all 47 states represented in the spine, disclosed honestly if any gap exists"
  - "dataset-completeness.test.ts and coverage-honesty.test.ts pass with zero manual additions"

steps:
  - id: implement
    description: Write scripts/gen_electricity_cost_data.py (single EIA API request, --globoff required, state-level direct join), data/electricity-cost.json, src/lib/datasets/electricity-cost.ts, data/electricity-cost-methodology.md.
    agent: developer
  - id: test
    description: Unit test, e2e block, registry entry, README bullet (41->42).
    agent: tester
    depends_on: [implement]
  - id: review
    description: Full pnpm verify ritual, live Playwright checks localhost + production, zero console errors.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit, push, merge, deploy, poll CI, mark complete.
    agent: developer
    depends_on: [review]

